<!DOCTYPE html>
<html>
    <head>
        <title>Rock-Paper-Scissors</title>
        <link rel = "stylesheet" href = "rps.css">
    </head>
    <body>
        <h1>ROCK-PAPER-SCISSORS</h1>
        <button class ="r">✊</button>
        <button class ="pa">📃</button>
        <button class = "s">✂️</button>
        <p id = "w">Wins: 0 </p>
        <p id = "l">Losses: 0 </p>
        <p id = "t">Ties: 0</p>
        <button class = "re">🔄️</button>
        <script>
            let wc = 0;
            let lc = 0;
            let tc = 0;
            let user = false;
            let r = document.getElementsByClassName("r");
            let re = document.getElementsByClassName("re");
            let pa = document.getElementsByClassName("pa");
            let s = document.getElementsByClassName("s");
            r[0].addEventListener("click",rock);
            pa[0].addEventListener("click",paper);
            s[0].addEventListener("click",scissors);
            re[0].addEventListener("click" , reset);
            function rock(){
                const num = Math.random();
                if(num<= 1/3){
                    alert("Computer chose rock. That is a Tie!");
                    tc++;
                }
                else if(num>1/3 && num<= 2/3){
                    alert("Computer chose paper. Computer Won!");
                    lc++;
                }
                else{
                    alert("Computer chose scissors. You Won!");
                    wc++;
                }
                updateScore();
            }
            function paper(){
                const num = Math.random();
                if(num <= 1/3){
                    alert("Computer chose rock. You Won!");
                    wc++;
                }
                else if(num >1/3 && num <= 2/3){
                    alert("Computer chose paper. That is a Tie!");
                    tc++;
                }
                else{
                    alert("Computer chose scissors. Computer Won!");
                    lc++;
                }
                updateScore();
            }
            function scissors(){
                const num = Math.random();
                if(num <= 1/3){
                    alert("Computer chose rock. Computer Won!");
                    lc++;
                }
                else if(num >1/3 && num<=2/3){
                    alert("Computer chose paper. You Won!");
                    wc++;
                }
                else{
                    alert("Computer chose scissors. That is a Tie!");
                    tc++;
                }
                updateScore();
            }
            function reset(){
                document.getElementById("w").innerHTML = `Wins: 0`;
                document.getElementById("l").innerHTML = `Losses: 0`;
                document.getElementById("t").innerHTML = `Ties: 0`;                
            }
            function updateScore() {
                document.getElementById("w").innerHTML = `Wins: ${wc}`;
                document.getElementById("l").innerHTML = `Losses: ${lc}`;
                document.getElementById("t").innerHTML = `Ties: ${tc}`;
            }
            
        </script>
    </body>
</html>
